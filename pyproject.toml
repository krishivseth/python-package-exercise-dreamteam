[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dreamteam-password-roaster"
version = "0.1.0"
description = "A playful password scoring package."
readme = "README.md"
requires-python = ">=3.13"
license-files = ["LICENSE"]

[project.urls]
Repository = "https://github.com/krishivseth/python-package-exercise-dreamteam"

[tool.setuptools]
packages = ["password_roaster"]
